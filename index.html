<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Viewer Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <section class="search-viewer" aria-label="Демо поиска">
      <div class="top-controls">
        <div class="search-panel" data-open="false">
          <div class="search-shell">
            <span class="search-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"></circle>
                <path d="M16 16L21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
              </svg>
            </span>

            <div class="search-main">
              <label class="sr-only" for="search-input">Поиск по таблице</label>
              <input
                id="search-input"
                class="search-input"
                type="text"
                placeholder="Search by keyword or any parameter..."
                autocomplete="off"
              >
            </div>
          </div>

          <div id="search-dropdown" class="search-dropdown">
            <div id="dropdown-selected-filters" class="selected-filters-row" hidden></div>

            <div id="idle-state" class="idle-state">
              <p class="idle-title">Start typing to search</p>
            </div>

            <div id="suggestions-root" class="suggestions-root" hidden></div>

            <div class="search-footer">
              <div class="search-footer-hint">
                <span><kbd>↑</kbd><kbd>↓</kbd> To Navigate</span>
                <span><kbd>↵</kbd> To Select</span>
                <span><kbd>esc</kbd> To Exit</span>
              </div>
              <div class="search-footer-actions">
                <button id="reset-button" class="footer-action footer-action-reset" type="button">Reset</button>
                <button id="apply-button" class="footer-action footer-action-apply" type="button">Apply</button>
              </div>
            </div>
          </div>
        </div>

        <div class="filter-panel" data-open="false">
          <button id="filter-toggle" class="filter-trigger" type="button" aria-label="Фильтры" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M4 7H20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
              <path d="M8 12H16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
              <path d="M11 17H13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
            </svg>
          </button>

          <div id="filter-menu" class="filter-menu" hidden>
            <div class="filter-menu-header">
              <p class="filter-menu-title">Filters</p>
            </div>

            <div id="filter-groups" class="filter-groups"></div>

            <div class="filter-menu-actions">
              <button id="filter-add-button" class="filter-add-button" type="button">+ Add Filter Group</button>
              <button id="filter-reset-button" class="filter-reset-button" type="button">Reset</button>
              <button id="filter-apply-button" class="filter-apply-button" type="button">Apply</button>
            </div>
          </div>
        </div>
      </div>

      <div class="external-filters-bar">
        <div id="external-selected-filters" class="selected-filters-row external-selected-filters" hidden></div>
        <button id="reset-all-button" class="reset-all-button" type="button" hidden>Reset All</button>
      </div>

      <div class="results-head">
        <div>
          <p class="eyebrow">Demo Data</p>
          <h1>Search Linked To Table</h1>
        </div>
        <p id="results-count" class="results-count">0 rows</p>
      </div>

      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>ID</th>
              <th>Name</th>
              <th>Category</th>
              <th>Score 1</th>
              <th>Score 2</th>
              <th>Status</th>
              <th>Description</th>
            </tr>
          </thead>
          <tbody id="results-body"></tbody>
        </table>

        <div id="empty-state" class="empty-state" hidden>
          Nothing matched the current search query.
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
  <script src="category-normalization.js"></script>
</body>
</html>
